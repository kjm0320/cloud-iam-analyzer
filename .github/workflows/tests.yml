name: IAM Analyzer Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 자동 테스트 실행
        run: python -m unittest discover -s tests -v